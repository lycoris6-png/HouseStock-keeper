<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スカーフの少年 3Dモデル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Layout: full-bleed 3D stage; title block top-left; one control dock bottom-center that wraps on phones. */
  :root {
    --bg: #eef1f7;
    --bg-glow: #dce5f4;
    --ink: #1a2133;
    --ink-soft: #566079;
    --panel: rgba(255, 255, 255, 0.8);
    --line: rgba(26, 33, 51, 0.16);
    --accent: #ee7d14;
    --accent-ink: #ffffff;
    --blue: #2f86e2;
    --font: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11151e;
      --bg-glow: #1f283a;
      --ink: #e9edf6;
      --ink-soft: #98a4be;
      --panel: rgba(23, 28, 40, 0.82);
      --line: rgba(233, 237, 246, 0.18);
      --accent: #ff9a3a;
      --accent-ink: #1c1204;
      --blue: #5aa5ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11151e;
    --bg-glow: #1f283a;
    --ink: #e9edf6;
    --ink-soft: #98a4be;
    --panel: rgba(23, 28, 40, 0.82);
    --line: rgba(233, 237, 246, 0.18);
    --accent: #ff9a3a;
    --accent-ink: #1c1204;
    --blue: #5aa5ff;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image: radial-gradient(110% 85% at 50% 36%, var(--bg-glow) 0%, var(--bg) 72%);
    color: var(--ink);
    font-family: var(--font);
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }

  .title {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
    padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .title h1 { margin: 0; font-size: clamp(20px, 3.2vw, 30px); font-weight: 600; letter-spacing: 0.03em; line-height: 1.2; text-wrap: balance; }
  .title .sub { margin: 6px 0 0; font-size: 13px; color: var(--ink-soft); line-height: 1.5; max-width: 34em; }
  .title .stats { margin: 4px 0 0; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }

  .dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .hint { margin: 0; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.02em; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; pointer-events: auto; max-width: 100%; }
  .seg {
    display: inline-flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .seg button {
    appearance: none;
    border: 0;
    margin: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    line-height: 1;
    padding: 11px 13px;
    min-height: 38px;
    cursor: pointer;
    white-space: nowrap;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .seg button:disabled { opacity: 0.4; cursor: default; }
  .seg button:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  .seg.dl button { color: var(--blue); }

  [hidden] { display: none !important; }
  body.no-ui .title, body.no-ui .dock { display: none; }
  @media (max-width: 560px) {
    .hint { display: none; }
    .seg button { padding: 10px 10px; font-size: 12.5px; }
  }
  @media (prefers-reduced-motion: reduce) { #stage { cursor: default; } }
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="スカーフの少年の3Dモデル。ドラッグで回転、スクロールで拡大"></canvas>

<header class="title">
  <h1>スカーフの少年</h1>
  <p class="sub">リファレンス画像から起こした、ボーン入りの3Dモデル。</p>
  <p class="stats" id="stats"></p>
</header>

<div class="dock">
  <p class="hint">ドラッグで回転 · スクロールやピンチで拡大</p>
  <div class="row" role="toolbar" aria-label="表示の操作">
    <div class="seg" role="group" aria-label="ポーズ">
      <button id="pose-leap" type="button" aria-pressed="true">ジャンプ</button>
      <button id="pose-apose" type="button" aria-pressed="false">Aポーズ</button>
    </div>
    <div class="seg" role="group" aria-label="視点">
      <button id="view-front" type="button">正面</button>
      <button id="view-q" type="button">斜め</button>
      <button id="view-side" type="button">横</button>
      <button id="view-back" type="button">背面</button>
    </div>
  </div>
  <div class="row">
    <div class="seg" role="group" aria-label="シェーディング">
      <button id="style-toon" type="button" aria-pressed="true">トゥーン</button>
      <button id="style-pbr" type="button" aria-pressed="false">PBR</button>
    </div>
    <div class="seg" role="group" aria-label="オプション">
      <button id="opt-outline" type="button" aria-pressed="true">輪郭線</button>
      <button id="opt-wire" type="button" aria-pressed="false">ワイヤー</button>
      <button id="opt-spin" type="button" aria-pressed="false">自動回転</button>
    </div>
    <div class="seg dl" role="group" aria-label="書き出し">
      <button id="dl-pose" type="button">GLB (ジャンプ)</button>
      <button id="dl-apose" type="button">GLB (Aポーズ)</button>
      <button id="dl-zip" type="button" hidden>2つのGLBをZIPで保存</button>
    </div>
  </div>
</div>
